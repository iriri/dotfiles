unbind C-b
set -sa terminal-features ,xterm-16color:RGB
set -s extended-keys on
set -s extended-keys-format csi-u
set -s focus-events on
set -g history-limit 10000
set -g prefix C-j
set -s escape-time 50
set -g repeat-time 0
set -g status-keys emacs
set -wg mode-keys vi
set -g mouse off
set -g status-bg colour6
set -wg window-status-current-style bg=colour7
set -g base-index 1
set -g allow-rename off
set -g message-style fg=colour0,bg=colour7,fill=colour7
set -g mode-style fg=colour0,bg=colour7
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind "'" last-window
bind t new-window -c "#{pane_current_path}"
bind s split-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
